<iframe id="unicode-text" src="ma2-paper8-kalidasa-kritiyan-source-r2.html" title="कालिदास की कृतियाँ, कथा-सार का यूनिकोड पाठ"></iframe>
<script>
(function () {
  var frame = document.getElementById('unicode-text');
  frame.addEventListener('load', function () {
    var doc = frame.contentDocument;
    if (!doc) return;
    var style = doc.createElement('style');
    style.textContent = '*{box-sizing:border-box}html{overflow-wrap:anywhere}body{max-width:900px;margin:0 auto;padding:18px}.cover .box{max-width:100%}@media(max-width:600px){table,thead,tbody,tr,td,th{display:block!important;width:100%!important;max-width:100%!important;white-space:normal!important}tr:has(th){display:none!important}tr{margin:0 0 16px;border:1px solid #ddd}td{border:0!important;border-bottom:1px solid #eee!important}td[data-label]::before{content:attr(data-label) " : ";font-weight:bold;color:#5d3928}}';
    doc.head.appendChild(style);
    Array.prototype.forEach.call(doc.querySelectorAll('table'), function (table) {
      var labels = Array.prototype.map.call(table.querySelectorAll('tr:first-child th'), function (th) { return th.textContent.trim(); });
      if (!labels.length) return;
      Array.prototype.forEach.call(table.querySelectorAll('tr'), function (row) { Array.prototype.forEach.call(row.querySelectorAll('td'), function (td, i) { if (labels[i]) td.setAttribute('data-label', labels[i]); }); });
    });
    Array.prototype.forEach.call(doc.querySelectorAll('a[href]'), function (a) { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  });
}());
</script>
